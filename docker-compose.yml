services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: computerstore-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: ./backend
      dockerfile: src/ComputerStore.Api/Dockerfile
    container_name: computerstore-api
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ComputerStoreDb;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: "ComputerStore.Api"
      Jwt__Audience: "ComputerStore.Client"
      Jwt__SecretKey: "ComputerStore.SuperSecretKey.ForDotNet8.Jwt.Token.2026"
      Jwt__ExpiryMinutes: "480"
    ports:
      - "8088:8080"
    volumes:
      - ./backend/src/ComputerStore.Api/wwwroot/uploads:/app/wwwroot/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: computerstore-web
    depends_on:
      - api
    ports:
      - "3001:80"

volumes:
  sql_data:
